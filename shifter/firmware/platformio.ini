; LSK H/SEQ Shifter firmware — by Sunggwan
; Build: pio run   /  Upload: pio run -t upload (BOOTSEL mode)
[env:rp2040zero]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2040_zero
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.1m
; USB device name — shown in Windows "Set up USB game controllers" (joy.cpl), device manager, Linux lsusb
board_build.arduino.earlephilhower.usb_manufacturer = Sunggwan
board_build.arduino.earlephilhower.usb_product = LSK HSEQ Shifter
build_flags =
    -DFW_MAKER=\"Sunggwan\"
    -DFW_PRODUCT=\"LSK\ HSEQ\ Shifter\"
    -DFW_VERSION=\"0.5.0\"
